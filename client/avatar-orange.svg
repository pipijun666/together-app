<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FED7AA"/>
    </linearGradient>
    <linearGradient id="orangeBody" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFA24C"/>
      <stop offset="50%" stop-color="#FB7A24"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="orangeHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#EA580C" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bgOrange)"/>
  <circle cx="256" cy="256" r="238" fill="none" stroke="#FDBA74" stroke-width="4" stroke-dasharray="8 8" opacity="0.6"/>

  <!-- Leaf and Stem -->
  <path d="M256 160 C256 120, 265 100, 275 85" fill="none" stroke="#78350F" stroke-width="12" stroke-linecap="round"/>
  <path d="M265 110 C320 80, 360 115, 345 150 C300 170, 270 140, 265 110 Z" fill="url(#leafGrad)"/>
  <path d="M267 113 Q305 130 340 148" fill="none" stroke="#15803D" stroke-width="3" opacity="0.6" stroke-linecap="round"/>

  <!-- Orange Body -->
  <ellipse cx="256" cy="290" rx="155" ry="145" fill="url(#orangeBody)" filter="url(#softShadow)"/>
  <ellipse cx="220" cy="210" rx="90" ry="58" fill="url(#orangeHighlight)" transform="rotate(-15 220 210)"/>

  <!-- Cheerful Happy Eyes -->
  <path d="M195 270 C205 255, 225 255, 235 270" fill="none" stroke="#431407" stroke-width="10" stroke-linecap="round"/>
  <path d="M277 270 C287 255, 307 255, 317 270" fill="none" stroke="#431407" stroke-width="10" stroke-linecap="round"/>

  <!-- Cute Rosy Cheeks -->
  <ellipse cx="185" cy="295" rx="22" ry="12" fill="#F43F5E" opacity="0.42"/>
  <ellipse cx="327" cy="295" rx="22" ry="12" fill="#F43F5E" opacity="0.42"/>

  <!-- Sweet Happy Smile with little tongue -->
  <path d="M238 295 Q256 318 274 295" fill="none" stroke="#431407" stroke-width="9" stroke-linecap="round"/>
  <path d="M246 303 Q256 318 266 303 Z" fill="#FB7185"/>

  <!-- Sparkles -->
  <path d="M385 190 Q395 190 395 180 Q395 190 405 190 Q395 190 395 200 Q395 190 385 190 Z" fill="#F59E0B"/>
  <circle cx="130" cy="210" r="6" fill="#FBBF24"/>
</svg>
