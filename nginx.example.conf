# Replace the domain and certificate paths. Keep /internal restricted to the US IP if stable.
server {
    listen 80;
    server_name your-domain.example;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name your-domain.example;
    ssl_certificate /etc/letsencrypt/live/your-domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8m;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    # Worker traffic uses the WireGuard-only host port. Never proxy internal APIs publicly.
    location ^~ /internal/ {
        return 404;
    }
    # Authenticated media offload: app validates the session, then X-Accel redirects here.
    # `internal` prevents clients from bypassing Together authorization.
    location ^~ /__together_video/ {
        internal;
        alias /srv/together/data/media/;
        default_type video/mp4;
        sendfile on;
        tcp_nopush on;
        add_header Cache-Control "private, max-age=604800, immutable" always;
        add_header Vary "Cookie" always;
    }
    location ^~ /__together_image/ {
        internal;
        alias /srv/together/data/media/;
        default_type image/webp;
        sendfile on;
        add_header Cache-Control "private, max-age=604800, immutable" always;
        add_header Vary "Cookie" always;
    }
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
